# Keeps PKGBUILD on the newest Linux LTS that OpenZFS supports
# (bin/follow-lts.py): point releases of our series as soon as kernel.org
# publishes them, a new LTS series once OpenZFS and Arch's linux-lts are
# there. Tarballs are checked against their PGP signatures and every patch
# must apply before anything is committed; the commit goes to dev, where
# the nightly publish-packages of freedomnas-arch and freedomnas-deb find a
# kernel version not published yet and build it.
#
# Needs the secret LTS_PUSH_TOKEN: a Codeberg access token with write
# access to this repository (scope write:repository).
name: follow-lts

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * *"

jobs:
  follow:
    runs-on: codeberg-medium
    container:
      image: debian:trixie
    steps:
      - name: Install the tooling
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git nodejs ca-certificates python3 gnupg gpgv xz-utils patch

      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.LTS_PUSH_TOKEN }}

      - name: Follow the LTS
        run: python3 -I bin/follow-lts.py --apply

      - name: Commit and push
        run: |
          git config --global --add safe.directory "$PWD"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit"
            exit 0
          fi
          version=$(sed -n 's/^pkgver=//p' PKGBUILD)
          zfs=$(sed -n 's/^_zfsver=//p' PKGBUILD)
          git add -A
          git -c user.name="FreedomNAS CI" -c user.email="ci@freedomnas.invalid" \
            commit -m "Follow Linux $version with OpenZFS $zfs"
          git push origin HEAD:dev
