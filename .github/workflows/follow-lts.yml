# Keeps PKGBUILD on the newest Linux LTS that OpenZFS supports
# (bin/follow-lts.py): point releases of our series as soon as kernel.org
# publishes them, a new LTS series once OpenZFS and Arch's linux-lts are
# there. Tarballs are checked against their PGP signatures and every patch
# must apply before anything is committed; the commit goes to dev. A push
# made with GITHUB_TOKEN starts no other workflow, so this one tells the
# package repositories itself, as notify-packages does after any other push.
name: follow-lts

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * *"

permissions:
  contents: write

jobs:
  follow:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    steps:
      - name: Install the tooling
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates curl python3 gnupg gpgv xz-utils patch

      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Follow the LTS
        run: python3 -I bin/follow-lts.py --apply

      - name: Commit and push
        id: push
        run: |
          git config --global --add safe.directory "$PWD"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit"
            exit 0
          fi
          version=$(sed -n 's/^pkgver=//p' PKGBUILD)
          zfs=$(sed -n 's/^_zfsver=//p' PKGBUILD)
          git add -A
          git -c user.name="FreedomNAS CI" -c user.email="ci@freedomnas.invalid" \
            commit -m "Follow Linux $version with OpenZFS $zfs"
          git push origin HEAD:dev
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Notify the package repositories
        if: steps.push.outputs.sha != ''
        env:
          TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          [ -n "$TOKEN" ] || { echo "the PACKAGES_DISPATCH_TOKEN secret is not set" >&2; exit 1; }
          failed=""
          for repo in freedomnas-deb freedomnas-arch freedomnas-void freedomnas-freebsd; do
            curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/FreedomNAS/$repo/dispatches" \
              -d "{\"event_type\":\"component-pushed\",\"client_payload\":{\"ref\":\"dev\",\"repository\":\"$GITHUB_REPOSITORY\",\"sha\":\"$SHA\"}}" \
              || failed="$failed $repo"
          done
          [ -z "$failed" ] || { echo "could not notify:$failed" >&2; exit 1; }
